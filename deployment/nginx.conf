# ARCHIVED: Not used by the current deployment architecture.
# Deployment is single-container (`api` image) and FastAPI serves built frontend assets.
# Keep this file only for historical context.

server {
    listen 80;
    server_name _;

    # Serve static React build
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to uvicorn sidecar (same ECS task = localhost)
    location /api/ {
        proxy_pass http://localhost:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # RAG queries can take 30-60s; SSE enrichment streams run longer
        proxy_read_timeout 120s;
        # Required for SSE (enrichment stream endpoint)
        proxy_buffering off;
    }

    # Health check for ALB — proxies to FastAPI health endpoint
    location /health {
        proxy_pass http://localhost:8003/api/health;
    }
}
