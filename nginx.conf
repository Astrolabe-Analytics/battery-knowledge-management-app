server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Public health endpoint for ALB/ECS.
    # Proxies to FastAPI health check so the whole stack must be alive.
    location = /health {
        proxy_pass http://127.0.0.1:8003/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # API requests go to FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Good for long-running responses / SSE
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }

    # React SPA routes
    location / {
        try_files $uri /index.html;
    }
}
